[package]
name = "tobasu"
version = "0.1.0"
edition = "2024"
description = "Local anime library player that finds and skips openings and endings"
license = "GPL-3.0-or-later"
repository = "https://github.com/misutesu-desu/tobasu"

[dependencies]
encoding_rs = "0.8.42"
fancy-regex = "0.19.2"
indexmap = { version = "2.14.2", features = ["serde"] }
rayon = "1.12.0"
realfft = "3.5.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
tao = "0.37.1"
ureq = { version = "2", features = ["json"] }
wry = "0.57.0"

[[bin]]
name = "Tobasu"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
