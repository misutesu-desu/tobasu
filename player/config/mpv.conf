# Tobasu oynatıcı ayarları: en yüksek akıcılık, en az yük.

# --- Görüntü: GPU ile çöz ve çiz
vo=gpu-next
gpu-api=d3d11
# Laptopta NVIDIA kartını kullan (bulunamazsa varsayılan kart kullanılır)
d3d11-adapter=NVIDIA
hwdec=d3d11va,nvdec,auto-safe

# --- Akıcılık: kare ritmini ekran tazeleme hızına eşitle.
# 2.5x'te 24 fps içerik 60 fps olur; 144 Hz ekranda düzensiz (2-3-2-3) gösterim yerine
# kareler zamanlamaya göre harmanlanır. oversample ara kare uydurmaz, çizgileri bozmaz.
video-sync=display-resample
interpolation=yes
tscale=oversample

# --- Ses: hızlanınca perde değişmez (scaletempo2)
audio-pitch-correction=yes

# --- Altyazı ve ses dili tercihleri
slang=tur,tr,turkish,eng,en
alang=jpn,ja,tur,tr
sub-auto=fuzzy

# --- Kullanım
keep-open=no
save-position-on-quit=yes
watch-later-options-remove=speed
autofit-larger=90%x90%
osd-duration=1200

# --- Arayüz: uosc (OP/ED aralıkları zaman çubuğunda renkli görünür)
osc=no
osd-bar=no
